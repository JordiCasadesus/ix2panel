{% extends "layout.html" %}

{% block content %}
<section class="login-wrap">
  <div class="card-group login-card">
    <h2>Acceso</h2>
    <div class="card">
      <form method="post" class="login-form" autocomplete="on">
        <div class="login-row">
          <label for="username">Usuario</label>
          <input id="username" name="username" type="text" autocomplete="username" required autofocus />
        </div>

        <div class="login-row">
          <label for="password">Contraseña</label>
          <div class="login-pass-wrap">
            <input id="password" name="password" type="password" autocomplete="current-password" required />
            <button type="button" class="login-eye" id="login-eye-btn" aria-label="Mostrar contraseña">&#128065;</button>
          </div>
        </div>

        {% if error %}
          <div class="login-error">{{ error }}</div>
        {% endif %}

        <button type="submit" class="btn btn-block">Entrar</button>
      </form>
    </div>
  </div>
</section>

<script src="{{ url_for('static', filename='js/login.js') }}{% if static_ver is defined %}?v={{ static_ver('js/login.js') }}{% endif %}"></script>
{% endblock %}
